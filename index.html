<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lokadia-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F4C81" />
    <!-- Installation sur l'écran d'accueil iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lokadia" />
    <!-- Balises par défaut. Elles portent `data-lk-seo` : le composant Seo
         (src/app/lib/seo) les remplace par celles de la page affichée, et
         le prérendu de build les réécrit pour les robots. -->
    <title>Lokadia — Voyagez informé</title>
    <meta
      name="description"
      data-lk-seo
      content="Avant de partir : niveau de sécurité indicatif par destination, alertes issues de sources officielles, formalités d'entrée et itinéraires — consultables même hors connexion."
    />
    <meta name="robots" data-lk-seo content="index, follow, max-image-preview:large" />
    <meta property="og:type" data-lk-seo content="website" />
    <meta property="og:site_name" data-lk-seo content="Lokadia" />
    <meta property="og:locale" data-lk-seo content="fr_FR" />
    <meta property="og:title" data-lk-seo content="Lokadia — Voyagez informé" />
    <meta
      property="og:description"
      data-lk-seo
      content="Avant de partir : niveau de sécurité indicatif par destination, alertes issues de sources officielles, formalités d'entrée et itinéraires — consultables même hors connexion."
    />
    <meta property="og:image" data-lk-seo content="/og-default.png" />
    <meta name="twitter:card" data-lk-seo content="summary_large_image" />
    <!-- Police Inter auto-hébergée (voir scripts/fetch-fonts.mjs) : aucune
         requête vers Google, donc aucune IP de visiteur transmise à un tiers.
         Préchargement du sous-ensemble latin, celui du premier rendu. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      html, body { height: 100%; margin: 0; background: #FAFAFA; }
      html.dark, html.dark body { background: #0B1220; }
      #root { height: 100%; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
    <!-- Thème appliqué avant le premier rendu, sinon une page sombre
         commence par un éclair blanc. Fichier externe et non script en
         ligne : la CSP du site interdit `unsafe-inline`. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
